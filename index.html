<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple 25-question trivia game." />
    <title>Trivia</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="board-view" class="view active" aria-labelledby="board-title">
        <h1 id="board-title">Trivia</h1>
        <div id="board" class="board" aria-label="Trivia question board"></div>
      </section>

      <section id="question-view" class="view question-view" aria-labelledby="question-title" hidden>
        <button id="back-button" class="back-button" type="button" aria-label="Return to board">←</button>
        <div class="question-card">
          <h2 id="question-title">Question goes here</h2>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
